# ==============================================================================
# AiiDA Profile Configuration (YAML Format)
# ==============================================================================
# This is an ALTERNATE configuration format.
# The main configuration file is: config.env (KEY=VALUE format)
# This file is optional and can be used for compatibility with other tools.
#
# If both config.env and profile.yaml exist, config.env takes priority.

conda:
  env_name: "aiida"
  python_version: "3.10"
  packages:
    - "aiida-core"
    - "aiida-vasp"
  channels:
    - "conda-forge"

database:
  host: "127.0.0.1"
  port: 5432
  username: "aiida_user"
  password: "123"
  name: "aiida_db"

rabbitmq:
  host: "127.0.0.1"
  port: 5672
  username: "aiida"
  password: "123"
  vhost: "aiida"

user:
  email: "your.email@example.com"
  firstname: "YourFirstName"
  lastname: "YourLastName"
  institution: "YourInstitution"

profile:
  name: "aiida_profile"
  repository_uri: "file:///tmp/aiida_repository"
